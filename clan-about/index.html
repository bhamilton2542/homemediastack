<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clan HQ // Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171A;
    --panel:#1E2226;
    --panel-2:#262B30;
    --line:#333A40;
    --approve:#8FBC5A;
    --deny:#C4432B;
    --text:#E4E8DC;
    --text-dim:#8B9088;
    --amber:#D9A441;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, transparent 1px, transparent 2px),
      var(--bg);
    color:var(--text);
    font-family:'Share Tech Mono', monospace;
    padding:24px 16px 60px;
  }

  .scanlines{
    position:fixed;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(180deg, rgba(0,0,0,0.06) 0px, transparent 1px, transparent 3px);
    z-index:100;
  }

  .wrap{max-width:680px;margin:0 auto;}

  .hq-header{
    text-align:center;
    margin-bottom:28px;
    padding-bottom:18px;
    border-bottom:2px solid var(--line);
  }
  .hq-eyebrow{
    font-size:11px;
    letter-spacing:0.3em;
    color:var(--amber);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  h1{
    font-family:'Black Ops One', sans-serif;
    font-size:clamp(26px, 6vw, 38px);
    margin:0;
    letter-spacing:0.02em;
    text-shadow:0 0 20px rgba(143,188,90,0.15);
  }
  .hq-sub{
    font-size:12px;
    color:var(--text-dim);
    margin-top:8px;
    letter-spacing:0.05em;
  }

  .links-row{
    display:flex;
    gap:12px;
    margin-bottom:28px;
  }
  .link-btn-big{
    flex:1;
    display:block;
    text-align:center;
    padding:16px;
    border:1px solid;
    font-family:'Black Ops One', sans-serif;
    font-size:14px;
    letter-spacing:0.06em;
    text-decoration:none;
    transition:all 0.15s ease;
  }
  .link-btn-big.discord{border-color:var(--approve);color:var(--approve);}
  .link-btn-big.discord:hover{background:var(--approve);color:var(--bg);}
  .link-btn-big.vote{border-color:var(--amber);color:var(--amber);}
  .link-btn-big.vote:hover{background:var(--amber);color:var(--bg);}
  .link-btn-big:focus-visible{outline:2px solid currentColor;outline-offset:2px;}

  .section-label{
    font-size:11px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin:28px 0 12px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .section-label::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--line);
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    padding:20px;
    position:relative;
    overflow:hidden;
  }
  .panel::before{
    content:'';
    position:absolute;
    top:0;left:0;right:0;
    height:3px;
    background:linear-gradient(90deg, var(--approve), var(--amber), var(--deny));
  }

  .founder-name{
    font-family:'Black Ops One', sans-serif;
    font-size:20px;
    color:var(--amber);
    margin-bottom:10px;
  }
  .founder-bio{
    font-size:14px;
    line-height:1.7;
    color:var(--text);
    white-space:pre-wrap;
  }

  .rules-text{
    font-size:14px;
    line-height:1.8;
    color:var(--text);
    white-space:pre-wrap;
  }

  .footer-row{
    text-align:center;
    margin-top:40px;
    padding-top:16px;
    border-top:1px dashed var(--line);
  }
  .link-btn{
    background:none;
    border:none;
    color:var(--text-dim);
    font-family:'Share Tech Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    cursor:pointer;
    text-decoration:underline;
    padding:0;
  }
  .link-btn:hover{color:var(--text);}
  .link-btn:focus-visible{outline:2px solid var(--amber);}

  /* ===== login modal ===== */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:200;
    padding:16px;
  }
  .modal-overlay.open{display:flex;}
  .modal-panel{
    background:var(--panel);
    border:1px solid var(--line);
    padding:24px;
    max-width:340px;
    width:100%;
    position:relative;
  }
  .modal-panel::before{
    content:'';
    position:absolute;
    top:0;left:0;right:0;
    height:3px;
    background:linear-gradient(90deg, var(--approve), var(--amber), var(--deny));
  }
  .modal-title{
    font-family:'Black Ops One', sans-serif;
    font-size:15px;
    text-align:center;
    margin-bottom:16px;
    letter-spacing:0.05em;
  }
  .field-label{
    font-size:10px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--amber);
    margin-bottom:5px;
    display:block;
  }
  input[type="text"], input[type="password"], textarea{
    width:100%;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    padding:10px 12px;
    font-family:'Share Tech Mono', monospace;
    font-size:14px;
    margin-bottom:14px;
  }
  textarea{resize:vertical;min-height:100px;line-height:1.5;}
  input:focus-visible, textarea:focus-visible{outline:2px solid var(--amber);outline-offset:1px;}

  .btn{
    width:100%;
    padding:12px;
    border:1px solid;
    background:transparent;
    font-family:'Share Tech Mono', monospace;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    cursor:pointer;
    transition:all 0.15s ease;
  }
  .btn-amber{border-color:var(--amber);color:var(--amber);}
  .btn-amber:hover{background:var(--amber);color:var(--bg);}
  .btn-approve{border-color:var(--approve);color:var(--approve);margin-top:8px;}
  .btn-approve:hover{background:var(--approve);color:var(--bg);}

  .error-msg{
    color:var(--deny);
    font-size:12px;
    text-align:center;
    margin-top:10px;
    min-height:16px;
  }

  .modal-close{
    position:absolute;
    top:10px;right:10px;
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:18px;
    cursor:pointer;
    line-height:1;
  }
  .modal-close:hover{color:var(--text);}

  /* ===== edit mode ===== */
  .edit-bar{
    background:var(--panel-2);
    border:1px solid var(--amber);
    padding:10px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    font-size:11px;
    letter-spacing:0.08em;
    color:var(--amber);
  }
  .edit-bar .actions{display:flex;gap:14px;}

  @media (max-width:480px){
    .links-row{flex-direction:column;}
  }
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="wrap">

  <div id="edit-bar-container"></div>

  <div class="hq-header">
    <div class="hq-eyebrow">Operations Briefing</div>
    <h1 id="clan-title">CLAN HQ</h1>
    <div class="hq-sub">All personnel, review the briefing below.</div>
  </div>

  <div class="links-row">
    <a class="link-btn-big discord" id="discord-link" href="#" target="_blank" rel="noopener">Join Discord</a>
    <a class="link-btn-big vote" id="vote-link" href="#" target="_blank" rel="noopener">Review Board</a>
  </div>

  <div class="section-label">Commanding Officer</div>
  <div class="panel">
    <div class="founder-name" id="founder-name"></div>
    <div class="founder-bio" id="founder-bio"></div>
  </div>

  <div class="section-label">Rules of Engagement</div>
  <div class="panel">
    <div class="rules-text" id="rules-text"></div>
  </div>

  <div class="footer-row">
    <button class="link-btn" id="admin-toggle-btn">Command Access</button>
  </div>

</div>

<!-- LOGIN MODAL -->
<div class="modal-overlay" id="login-modal">
  <div class="modal-panel">
    <button class="modal-close" id="login-modal-close" aria-label="Close">✕</button>
    <div class="modal-title">COMMAND ACCESS</div>
    <label class="field-label">Passcode</label>
    <input type="password" id="modal-password" autocomplete="current-password" />
    <button class="btn btn-amber" id="modal-login-btn">Authenticate</button>
    <div class="error-msg" id="modal-login-error"></div>
  </div>
</div>

<!-- FORCED PASSWORD CHANGE MODAL -->
<div class="modal-overlay" id="cp-modal">
  <div class="modal-panel">
    <div class="modal-title">MANDATORY PASSCODE RESET</div>
    <label class="field-label">Current Passcode</label>
    <input type="password" id="cp-current" autocomplete="current-password" />
    <label class="field-label">New Passcode</label>
    <input type="password" id="cp-new" autocomplete="new-password" />
    <label class="field-label">Confirm New Passcode</label>
    <input type="password" id="cp-confirm" autocomplete="new-password" />
    <button class="btn btn-amber" id="cp-submit-btn">Set New Passcode</button>
    <div class="error-msg" id="cp-error"></div>
  </div>
</div>

<script>
  let isAdmin = false;
  let content = null;

  const loginModal = document.getElementById('login-modal');
  const cpModal = document.getElementById('cp-modal');

  async function loadContent(){
    const res = await fetch('/api/content');
    content = await res.json();
    render();
  }

  async function checkSession(){
    const res = await fetch('/api/me');
    const data = await res.json();
    isAdmin = data.is_admin;
    if(isAdmin && data.must_change_password){
      openModal(cpModal);
    }
    render();
  }

  function render(){
    if(!content) return;

    document.getElementById('discord-link').href = content.discord_url;
    document.getElementById('vote-link').href = content.vote_url;
    document.getElementById('clan-title').textContent = content.clan_name;
    document.getElementById('founder-name').textContent = content.founder_name;
    document.getElementById('founder-bio').textContent = content.founder_bio;
    document.getElementById('rules-text').textContent = content.rules_text;

    const editBarContainer = document.getElementById('edit-bar-container');
    if(isAdmin){
      editBarContainer.innerHTML = `
        <div class="edit-bar">
          <span>COMMAND MODE ACTIVE</span>
          <div class="actions">
            <button class="link-btn" id="edit-content-btn" style="color:var(--amber);">Edit Content</button>
            <button class="link-btn" id="logout-btn" style="color:var(--amber);">Log Out</button>
          </div>
        </div>
      `;
      document.getElementById('edit-content-btn').addEventListener('click', openEditForm);
      document.getElementById('logout-btn').addEventListener('click', doLogout);
    } else {
      editBarContainer.innerHTML = '';
    }
  }

  function openModal(modal){ modal.classList.add('open'); }
  function closeModal(modal){ modal.classList.remove('open'); }

  document.getElementById('admin-toggle-btn').addEventListener('click', () => {
    document.getElementById('modal-password').value = '';
    document.getElementById('modal-login-error').textContent = '';
    openModal(loginModal);
  });
  document.getElementById('login-modal-close').addEventListener('click', () => closeModal(loginModal));

  document.getElementById('modal-login-btn').addEventListener('click', attemptLogin);
  document.getElementById('modal-password').addEventListener('keydown', e => { if(e.key === 'Enter') attemptLogin(); });

  async function attemptLogin(){
    const password = document.getElementById('modal-password').value;
    const errorEl = document.getElementById('modal-login-error');
    errorEl.textContent = '';

    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password})
    });

    if(!res.ok){
      errorEl.textContent = 'ACCESS DENIED';
      return;
    }
    const data = await res.json();
    isAdmin = true;
    closeModal(loginModal);
    if(data.must_change_password){
      openModal(cpModal);
    }
    render();
  }

  async function doLogout(){
    await fetch('/api/logout', {method: 'POST'});
    isAdmin = false;
    render();
  }

  document.getElementById('cp-submit-btn').addEventListener('click', attemptChangePassword);
  document.getElementById('cp-confirm').addEventListener('keydown', e => { if(e.key === 'Enter') attemptChangePassword(); });

  async function attemptChangePassword(){
    const currentPw = document.getElementById('cp-current').value;
    const newPw = document.getElementById('cp-new').value;
    const confirmPw = document.getElementById('cp-confirm').value;
    const errorEl = document.getElementById('cp-error');
    errorEl.textContent = '';

    if(newPw.length < 4){
      errorEl.textContent = 'New passcode must be at least 4 characters.';
      return;
    }
    if(newPw !== confirmPw){
      errorEl.textContent = 'New passcode entries do not match.';
      return;
    }

    const res = await fetch('/api/change-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({current_password: currentPw, new_password: newPw})
    });

    if(!res.ok){
      const data = await res.json();
      errorEl.textContent = data.error || 'Could not update passcode.';
      return;
    }
    closeModal(cpModal);
  }

  function openEditForm(){
    const editBarContainer = document.getElementById('edit-bar-container');
    editBarContainer.innerHTML = `
      <div class="edit-bar">
        <span>EDITING CONTENT</span>
        <div class="actions">
          <button class="link-btn" id="cancel-edit-btn" style="color:var(--amber);">Cancel</button>
        </div>
      </div>
      <div class="panel" style="margin-bottom:20px;">
        <label class="field-label">Clan Name</label>
        <input type="text" id="edit-clan-name" value="${escapeAttr(content.clan_name)}" />
        <label class="field-label">Discord Invite URL</label>
        <input type="text" id="edit-discord" value="${escapeAttr(content.discord_url)}" />
        <label class="field-label">Vote Website URL</label>
        <input type="text" id="edit-vote" value="${escapeAttr(content.vote_url)}" />
        <label class="field-label">Founder Callsign</label>
        <input type="text" id="edit-founder-name" value="${escapeAttr(content.founder_name)}" />
        <label class="field-label">Founder Bio</label>
        <textarea id="edit-founder-bio">${escapeHtml(content.founder_bio)}</textarea>
        <label class="field-label">Rules of Engagement</label>
        <textarea id="edit-rules" style="min-height:160px;">${escapeHtml(content.rules_text)}</textarea>
        <button class="btn btn-approve" id="save-content-btn">Save Changes</button>
        <div class="error-msg" id="edit-error"></div>
      </div>
    `;
    document.getElementById('cancel-edit-btn').addEventListener('click', () => { render(); });
    document.getElementById('save-content-btn').addEventListener('click', saveContent);

    // Select all text on click/focus so typing replaces the pre-filled
    // value by default, instead of silently appending to it.
    document.querySelectorAll('#edit-clan-name, #edit-discord, #edit-vote, #edit-founder-name, #edit-founder-bio, #edit-rules')
      .forEach(el => el.addEventListener('focus', () => el.select()));
  }

  async function saveContent(){
    const payload = {
      discord_url: document.getElementById('edit-discord').value,
      vote_url: document.getElementById('edit-vote').value,
      clan_name: document.getElementById('edit-clan-name').value,
      founder_name: document.getElementById('edit-founder-name').value,
      founder_bio: document.getElementById('edit-founder-bio').value,
      rules_text: document.getElementById('edit-rules').value,
    };

    const res = await fetch('/api/content', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });

    if(!res.ok){
      document.getElementById('edit-error').textContent = 'Could not save changes.';
      return;
    }

    await loadContent();
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  function escapeAttr(str){
    return escapeHtml(str).replace(/"/g, '&quot;');
  }

  loadContent();
  checkSession();
</script>
</body>
</html>
